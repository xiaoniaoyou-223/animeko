name: ios14-build

# Builds an UNSIGNED .ipa of Animeko with the iOS deployment target lowered to 14.0.
# Lowering the target is the whole point: Xcode then embeds the back-deployed
# libswift_Concurrency.dylib into Animeko.app/Frameworks, which iOS 14.x does not
# ship in /usr/lib/swift. Signing happens later on Windows with Sideloadly.

on:
  workflow_dispatch:

jobs:
  build-ios14:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64

      - name: Fix JAVA_HOME and verify toolchain
        run: |
          set -uo pipefail
          if [ ! -x "${JAVA_HOME:-/nonexistent}/bin/java" ]; then
            echo "JAVA_HOME from setup-java is unusable; probing system JDKs"
            JH="$(/usr/libexec/java_home -v 21 2>/dev/null || true)"
            if [ -z "$JH" ]; then
              JH="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
            if [ -n "$JH" ]; then
              export JAVA_HOME="$JH"
              echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
            fi
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          chmod +x ./gradlew
          ./gradlew --version
          xcodebuild -version
          pod --version || true

      - name: Free disk space
        run: bash ./ci-helper/free-space-macos.sh || true

      - name: Lower iOS deployment target to 14.0
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '16.0'/platform :ios, '14.0'/" app/ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 16.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" \
            app/ios/Animeko.xcodeproj/project.pbxproj
          echo "--- Podfile ---"
          grep -n "platform :ios" app/ios/Podfile
          echo "--- pbxproj occurrences of 14.0 (expect 4) ---"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" app/ios/Animeko.xcodeproj/project.pbxproj

      - name: Configure Gradle for the runner
        run: |
          set -euo pipefail
          touch local.properties
          echo "ani.enable.ios=true" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> gradle.properties

      - name: Compile Kotlin (common + desktop)
        run: ./gradlew compileKotlin compileCommonMainKotlinMetadata --no-configuration-cache --stacktrace

      - name: Generate dummy framework
        run: ./gradlew :app:shared:application:generateDummyFramework --no-configuration-cache --stacktrace

      - name: Pod install
        run: ./gradlew :app:ios:podInstall --no-configuration-cache --stacktrace

      - name: Patch Info.plist
        run: ./gradlew :app:ios:patchInfoPlist --no-configuration-cache --stacktrace

      - name: Build unsigned IPA
        run: ./gradlew :app:ios:buildReleaseIpa --no-configuration-cache --stacktrace

      - name: Report IPA contents
        run: |
          IPA=app/ios/build/archives/release/Animeko.ipa
          ls -lh "$IPA"
          unzip -l "$IPA" | grep -i -E "Frameworks/|Info.plist" | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ani-ios14-ipa
          path: app/ios/build/archives/release/Animeko.ipa
          if-no-files-found: error
          retention-days: 7
