name: ios14-build

# Builds an UNSIGNED .ipa of Animeko with the iOS deployment target lowered to 14.0.
# Lowering the target is the point: Xcode then embeds the back-deployed
# libswift_Concurrency.dylib into Animeko.app/Frameworks, which iOS 14.x does not
# ship in /usr/lib/swift. Signing happens later on Windows with Sideloadly.

on:
  workflow_dispatch:

jobs:
  build-ios14:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JetBrains Runtime 21 (the required toolchain vendor)
        run: |
          set -euo pipefail
          URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-osx-aarch64-b1163.116.tar.gz"
          mkdir -p "$RUNNER_TEMP/jbr"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/jbr.tar.gz" "$URL"
          tar -xzf "$RUNNER_TEMP/jbr.tar.gz" -C "$RUNNER_TEMP/jbr"
          HOME_DIR="$(find "$RUNNER_TEMP/jbr" -maxdepth 5 -type d -name Home -path '*Contents*' | head -1)"
          if [ -z "${HOME_DIR:-}" ]; then
            echo "JBR layout not recognised:"; find "$RUNNER_TEMP/jbr" -maxdepth 3
            exit 1
          fi
          echo "JAVA_HOME=$HOME_DIR" >> "$GITHUB_ENV"
          echo "JBR_HOME=$HOME_DIR" >> "$GITHUB_ENV"
          echo "$HOME_DIR/bin" >> "$GITHUB_PATH"
          "$HOME_DIR/bin/java" -version

      - name: Verify toolchain
        run: |
          set -uo pipefail
          java -version
          chmod +x ./gradlew
          xcodebuild -version
          pod --version || true

      - name: Free disk space
        run: bash ./ci-helper/free-space-macos.sh || true

      - name: Lower deployment target to 14.0 (Podfile, Xcode project, Kotlin pods DSL)
        run: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '16.0'/platform :ios, '14.0'/" app/ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 16.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" \
            app/ios/Animeko.xcodeproj/project.pbxproj
          # tell the Kotlin CocoaPods plugin what to emit in application.podspec
          perl -0777 -pi -e 's/(extensions\.configure<CocoapodsExtension>\s*\{)/$1\n            ios.deploymentTarget = "14.0"/' \
            app/shared/application/build.gradle.kts
          echo "--- Podfile ---"; grep -n "platform :ios" app/ios/Podfile
          echo "--- pbxproj ---"; grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" app/ios/Animeko.xcodeproj/project.pbxproj
          echo "--- cocoapods DSL ---"; grep -n "deploymentTarget" app/shared/application/build.gradle.kts

      - name: Configure Gradle for the runner
        run: |
          set -euo pipefail
          echo "jvm.toolchain.version=21" >> local.properties
          echo "ani.enable.ios=true" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "org.gradle.java.installations.paths=$JBR_HOME" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> gradle.properties

      - name: Compile Kotlin (common + desktop)
        run: ./gradlew compileKotlin compileCommonMainKotlinMetadata --no-configuration-cache --stacktrace

      - name: Generate dummy framework
        run: ./gradlew :app:shared:application:generateDummyFramework --no-configuration-cache --stacktrace

      - name: Generate podspec and inspect platform
        run: |
          set -euo pipefail
          ./gradlew :app:shared:application:podspec --no-configuration-cache --stacktrace
          echo "--- generated podspecs ---"
          find . -name '*.podspec' -not -path './Pods/*' -print || true
          find . -name '*.podspec' -not -path './Pods/*' -exec grep -Hn "platform" {} \; || true

      - name: Force podspec platform to 14.0 (belt and braces)
        run: |
          set -euo pipefail
          find . -name '*.podspec' -not -path './Pods/*' -exec perl -pi -e "s/s\.platform\s*=\s*:ios,\s*'[0-9.]+'/s.platform = :ios, '14.0'/" {} \;
          find . -name '*.podspec' -not -path './Pods/*' -exec grep -Hn "platform" {} \; || true

      - name: Pod install
        run: ./gradlew :app:ios:podInstall -x :app:shared:application:podspec --no-configuration-cache --stacktrace

      - name: Patch Info.plist
        run: ./gradlew :app:ios:patchInfoPlist --no-configuration-cache --stacktrace

      - name: Build unsigned IPA
        run: ./gradlew :app:ios:buildReleaseIpa --no-configuration-cache --stacktrace

      - name: Report IPA contents
        run: |
          IPA=app/ios/build/archives/release/Animeko.ipa
          ls -lh "$IPA"
          unzip -l "$IPA" | grep -i -E "Frameworks/|Info.plist" | head -40
          echo "--- concurrency runtime embedded? ---"
          unzip -l "$IPA" | grep -i concurrency || echo "NOT embedded"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ani-ios14-ipa
          path: app/ios/build/archives/release/Animeko.ipa
          if-no-files-found: error
          retention-days: 7
