name: ios14-build

# Builds an UNSIGNED .ipa of Animeko whose **app target** deployment target is 14.0.
# Only the Xcode project is touched: Podfile and pod versions stay upstream, so
# CocoaPods resolution and the Gradle cinterop chain behave exactly as upstream.
# With IPHONEOS_DEPLOYMENT_TARGET < 15.0 the Swift toolchain back-deploys and
# embeds libswift_Concurrency.dylib into Animeko.app/Frameworks, which iOS 14.x
# does not provide in /usr/lib/swift.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'also run the full iOS build'
        type: boolean
        default: true

jobs:
  build-ios14:
    if: ${{ inputs.full }}
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JetBrains Runtime 21 (required toolchain vendor)
        run: |
          set -euo pipefail
          URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-osx-aarch64-b1163.116.tar.gz"
          mkdir -p "$RUNNER_TEMP/jbr"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/jbr.tar.gz" "$URL"
          tar -xzf "$RUNNER_TEMP/jbr.tar.gz" -C "$RUNNER_TEMP/jbr"
          HOME_DIR="$(find "$RUNNER_TEMP/jbr" -maxdepth 5 -type d -name Home -path '*Contents*' | head -1)"
          if [ -z "${HOME_DIR:-}" ]; then echo "JBR not found"; exit 1; fi
          echo "JAVA_HOME=$HOME_DIR" >> "$GITHUB_ENV"
          echo "JBR_HOME=$HOME_DIR" >> "$GITHUB_ENV"
          echo "$HOME_DIR/bin" >> "$GITHUB_PATH"
          "$HOME_DIR/bin/java" -version

      - name: Verify toolchain
        run: |
          set -uo pipefail
          java -version
          chmod +x ./gradlew
          xcodebuild -version
          pod --version || true

      - name: Free disk space
        run: bash ./ci-helper/free-space-macos.sh || true

      - name: Lower ONLY the app target deployment target to 14.0
        run: |
          set -euo pipefail
          PBX=app/ios/Animeko.xcodeproj/project.pbxproj
          echo "--- before ---"; grep -c "IPHONEOS_DEPLOYMENT_TARGET = 16.0" "$PBX" || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 16.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" "$PBX"
          echo "--- after (expect 0) ---"; grep -c "IPHONEOS_DEPLOYMENT_TARGET = 16.0" "$PBX" || true
          echo "--- new value count (expect >=1) ---"; grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" "$PBX"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" "$PBX" | grep -qv '^0$' || { echo "FATAL: pbxproj patch failed"; exit 1; }
          echo "--- Podfile untouched ---"; grep -n "platform :ios" app/ios/Podfile

      - name: Configure Gradle for the runner
        run: |
          set -euo pipefail
          echo "jvm.toolchain.version=21" >> local.properties
          echo "ani.enable.ios=true" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "org.gradle.java.installations.paths=$JBR_HOME" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> gradle.properties

      - name: Compile Kotlin (common + desktop)
        run: ./gradlew compileKotlin compileCommonMainKotlinMetadata --no-configuration-cache --stacktrace

      - name: Generate dummy framework
        run: ./gradlew :app:shared:application:generateDummyFramework --no-configuration-cache --stacktrace

      - name: Pod install (upstream podspec, untouched)
        run: |
          set -uo pipefail
          if ! ./gradlew :app:ios:podInstall --no-configuration-cache --stacktrace; then
            echo "===== verbose pod output ====="
            ( cd app/ios && pod install --verbose 2>&1 | tail -120 ) || true
            exit 1
          fi

      - name: Patch Info.plist
        run: ./gradlew :app:ios:patchInfoPlist --no-configuration-cache --stacktrace

      - name: Build unsigned IPA
        run: ./gradlew :app:ios:buildReleaseIpa --no-configuration-cache --stacktrace

      - name: Report IPA contents
        run: |
          IPA=app/ios/build/archives/release/Animeko.ipa
          ls -lh "$IPA"
          echo "--- app Info.plist MinimumOSVersion ---"
          unzip -p "$IPA" 'Payload/Animeko.app/Info.plist' | plutil -p - 2>/dev/null | grep -i -E "MinimumOSVersion|CFBundleIdentifier" || true
          echo "--- embedded frameworks ---"
          unzip -l "$IPA" | grep -i "Frameworks/" | head -30
          echo "--- concurrency runtime embedded? ---"
          unzip -l "$IPA" | grep -i concurrency || echo "NOT embedded"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ani-ios14-ipa
          path: app/ios/build/archives/release/Animeko.ipa
          if-no-files-found: error
          retention-days: 7
